name: Android native port build
on:
  push:
    branches: ["android/**"]
    paths: ["port/**", "src/**", "include/**", ".github/workflows/android-native.yml"]
  pull_request:
    paths: ["port/**", "src/**", "include/**", ".github/workflows/android-native.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rom-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test ROM loader without Nintendo assets
        run: |
          g++ -std=c++17 -Wall -Wextra -Iport/android -Iport/ntr/include \
            port/ntr/fs.cpp port/android/rom_loader.cpp \
            port/android/tests/rom_loader_test.cpp -o /tmp/rom_loader_test
          /tmp/rom_loader_test
      - name: Test complete PC HAL asset catalog extraction from synthetic ROM
        run: |
          g++ -std=c++17 -Wall -Wextra -Iport/android -Iport/ntr/include             port/ntr/fs.cpp port/android/rom_loader.cpp             port/android/blz.cpp port/android/assets_extract.cpp port/android/tests/assets_extract_test.cpp             -o /tmp/assets_extract_test
          /tmp/assets_extract_test
  touch-pad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Android touch -> original XInput state
        run: |
          g++ -std=c++17 -Wall -Wextra -pthread -Iport -Iport/android \
            port/android/touch_input.cpp port/android/tests/touch_input_test.cpp \
            -o /tmp/touch_input_test
          /tmp/touch_input_test
  romdata-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and SHA-verify synthetic PC ROM data with Java 8
        run: |
          mkdir -p /tmp/romdata-classes
          javac -source 8 -target 8 -d /tmp/romdata-classes \
            port/android/java/dev/judexobot/sm64ds/RomDataRebuilder.java \
            port/android/java/dev/judexobot/sm64ds/RomDataKit.java \
            port/android/tests/RomDataRebuilderTest.java \
            port/android/tests/RomDataKitTest.java
          java -cp /tmp/romdata-classes dev.judexobot.sm64ds.RomDataRebuilderTest
          java -cp /tmp/romdata-classes dev.judexobot.sm64ds.RomDataKitTest
  scene-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original scene PadData and Ctrl edges, frame sequence
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iport -Iport/android \
            port/android/scene_input.cpp port/android/tests/scene_input_test.cpp \
            -o /tmp/scene_input_test
          /tmp/scene_input_test
      - name: Verify Android ROM-clean missing/mismatched asset refusals
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iport             port/android/asset_root_refuse_android.cpp             port/android/tests/asset_root_refuse_test.cpp             -o /tmp/asset_root_refuse_test
          /tmp/asset_root_refuse_test
      - name: Test Android scene teardown readable memory guard
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iport             port/hal/readable_guard.cpp port/android/tests/readable_guard_test.cpp             -o /tmp/readable_guard_test
          /tmp/readable_guard_test
      - name: Verify original title scene finish and level commit ordering
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iport             port/android/tests/title_handoff_test.cpp -o /tmp/title_handoff_test
          /tmp/title_handoff_test
      - name: Execute original StartFile and level-request translation units
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            src/StartFile.c src/LoadLevelNoReturn.c src/LoadLevel.c \
            src/SetPlayerGlobals.c src/SetNumPlayers.c \
            port/android/tests/start_file_test.c -o /tmp/start_file_test
          /tmp/start_file_test
      - name: Execute original actor init and behavior Process with native callbacks
        run: |
          python3 port/android/source_gen.py --source src/func_0204335c.c --out /tmp/native-process
          python3 port/android/source_gen.py --source src/func_02043288.c --out /tmp/native-process
          g++ -std=c++17 -Wall -Wextra -Werror -Iport -Iinclude -Iport/ntr/include \
            /tmp/native-process/src/func_0204335c.cpp /tmp/native-process/src/func_02043288.cpp \
            port/android/tests/actor_process_test.cpp -o /tmp/actor_process_test
          /tmp/actor_process_test
      - name: Verify preserved native extern views and PC/Android Ctrl fan-out
        run: |
          python3 port/android/tests/native_imports_test.py
          g++ -std=c++17 -Wall -Wextra -Werror -Iport \
            port/android/tests/ctrl_publish_test.cpp -o /tmp/ctrl_publish_test
          /tmp/ctrl_publish_test
      - name: Load synthetic files through actual PC SharedFilePtr and LZ77 cache
        run: |
          g++ -std=c++17 -Wall -Wextra -DSM64DS_PLATFORM_ANDROID=1 -DSM64DS_FS_HOST_TEST=1 -DPORT_ROM_CLEAN=1 \
            -ffunction-sections -fdata-sections -Iport -Iport/ntr/include \
            port/hal/fs.cpp port/android/asset_root_refuse_android.cpp \
            port/android/tests/game_fs_test.cpp -Wl,--gc-sections -o /tmp/game_fs_test
          /tmp/game_fs_test
      - name: Verify committed target and original Stage boot ordering
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iport \
            port/android/tests/level_handoff_test.cpp -o /tmp/level_handoff_test
          /tmp/level_handoff_test
      - name: Execute original OAM reset and PC model primitives
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -DSM64DS_PLATFORM_ANDROID=1 \
            -ffunction-sections -fdata-sections -Iport -Iinclude -Iport/ntr/include \
            port/hal/model_host.cpp src/_ZN3OAM5ResetEv.cpp port/ntr/ppu_audit.cpp \
            port/android/tests/model_host_test.cpp -Wl,--gc-sections -o /tmp/model_host_test
          /tmp/model_host_test
      - name: Exercise actual Stage slot-0 adapter probe modes
        run: |
          g++ -std=c++17 -Wall -Wextra -DSM64DS_PLATFORM_ANDROID=1 \
            -ffunction-sections -fdata-sections -Iport/hal \
            port/hal/stage_slot0.cpp port/android/tests/stage_slot0_test.cpp \
            -Wl,--gc-sections -o /tmp/stage_slot0_test
          for mode in 0 1 2 3; do /tmp/stage_slot0_test "$mode"; done
      - name: Test actual Android title adapter commits and refusals
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pthread -Iport -Iport/android \
            -Iport/ntr/include -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            port/android/game_scene_entry.cpp port/android/scene_input.cpp \
            port/android/touch_input.cpp port/android/tests/game_scene_entry_test.cpp \
            -o /tmp/game_scene_entry_test
          /tmp/game_scene_entry_test
          /tmp/game_scene_entry_test refuse
      - name: Assert PC scene loop invokes same native scene-frame seam
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pc = Path("port/tests/walk_window.cpp").read_text()
          assert '#include "hal/scene_frame_shared.h"' in pc
          assert 'sm64ds_port::scene_frame_begin("scene loop");' in pc
          assert 'sm64ds_port::scene_frame_simulate(frame, !menu_on);' in pc
          assert 'sm64ds_port::scene_frame_complete(!menu_on);' in pc
          print("PC and Android scene-frame seam is shared")
          PY
  audio-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test real SDAT sequencer and mixer using synthetic audio
        run: |
          g++ -std=c++17 -Wall -Wextra -ffunction-sections -fdata-sections -Iport \
            port/hal/sdat/mixer.cpp port/hal/sdat/sseq.cpp port/hal/sdat/sdat.cpp \
            port/android/tests/audio_clock_test.cpp -Wl,--gc-sections -o /tmp/audio_clock_test
          /tmp/audio_clock_test
  backup-medium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist real PC backup medium across processes using synthetic data
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -DSM64DS_PLATFORM_ANDROID=1 \
            -DNTR_BACKUP_MEDIUM_ONLY=1 -Iport -Iport/ntr/include \
            port/ntr/backup.cpp port/android/tests/backup_medium_test.cpp \
            -o /tmp/backup_medium_test
          save_test_dir=$(mktemp -d)
          trap 'rm -rf "$save_test_dir"' EXIT
          SM64DS_ASSET_ROOT="$save_test_dir" /tmp/backup_medium_test write
          SM64DS_ASSET_ROOT="$save_test_dir" /tmp/backup_medium_test read
  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
      - name: Install Java Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35"
      - name: Compile Android touchscreen Java sources
        run: |
          mkdir -p build/android-classes
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/android-classes \
            $(find port/android/java -name '*.java')
      - name: Configure ARMv7
        run: |
          cmake -S port/android -B build/android-armv7 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release
      - name: Compile Android components (not a playable game)
        run: cmake --build build/android-armv7 --parallel 4
      - name: Verify compiled ARM ABI and original packed storage
        run: |
          python3 port/android/check_game_layout.py --build build/android-armv7 \
            --nm "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
      - name: Execute original fallthrough hooks on ARM CPU (not Android OS)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          python3 port/android/tests/verify_arm_codegen.py \
            --clang "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang++" \
            --qemu qemu-arm --out build/android-armv7/native_fallthrough_cpu_test
      - uses: actions/upload-artifact@v4
        with:
          name: sm64ds-android-armv7-components-NOT-APK
          path: |
            build/android-armv7/libsm64ds_android_core.a
            build/android-armv7/libsm64ds_android_audio.a
            build/android-armv7/libsm64ds_android_game_entry.a
            build/android-armv7/libsm64ds_android_game_flow.a
            build/android-armv7/libsm64ds_android.so
            build/android-classes/**
            build/android-armv7/android_runtime_test
            build/android-armv7/android_game_abi_test
            build/android-armv7/android_actor_process_test
            build/android-armv7/native_fallthrough_cpu_test
          if-no-files-found: error
      - name: Require complete game link (reports current unresolved dependencies)
        run: python3 port/android/check_game_link.py --build build/android-armv7
      - name: Preserve real game-link diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sm64ds-android-game-link-diagnostics
          path: |
            build/android-armv7/game-link.log
            build/android-armv7/game-link.json
          if-no-files-found: warn
